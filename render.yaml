services:
  - type: web
    name: nexyl-dashboard
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DASHBOARD_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: nexyl-postgres
          property: connectionString
      - key: PREMIUM_SERVER_ID
        sync: false
      - key: PREMIUM_ROLE_ID
        sync: false
      - key: PREMIUM_INVITE
        value: https://discord.gg/tBrKBdsgMe
      - key: BOT_INVITE
        value: https://discord.gg/ykYDrbBUQn
databases:
  - name: nexyl-postgres
